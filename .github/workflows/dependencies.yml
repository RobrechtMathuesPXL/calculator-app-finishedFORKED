name: Dependencies Example

on:
  push:
    branches:
      - main

jobs:
  checkout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        
      - name: Setup NPM framework
        run: npm install
        
      - name: Show directory contents & listing
        run: ls -alhR
