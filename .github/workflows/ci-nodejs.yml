name: CI-nodejs

on:
    push:
      branches:
      - main
    pull_request:
      branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          repository: PXL-2TIN-DevOps-Resources/calculator-app-finished
          
      - name: node.js installatie
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: dependecies installeren
        run: npm install

      - name: uitvoering unit tests
        run: npm test

      - name: generatie van een test coverage rapport
        run: npx jest --coverage

      - name: artifact aanmaken met de test resultaten
        uses: actions/upload-artifact@v4
        with:
          name: test resultaten
          path: coverage/

