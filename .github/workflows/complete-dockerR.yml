name: Docker example

on:
  push:
    branches:
      - main

jobs:
  checkout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - uses: actions/checkout@v6
      
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
             node-version: '20.x'
        
      - name: Setup NPM framework
        run: npm install
        
      - name: Run code
        run: npm run build --if-present
        
      - name: Test app
        run: npm test

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: robrechtmathues/nodejs-demo-app:latest
        
      - name: Bundle code into zip
        run: zip -r build.zip .
        
      - name: Show directory contents & listing
        run: ls -alhR
