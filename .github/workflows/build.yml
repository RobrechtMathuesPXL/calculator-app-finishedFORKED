name: Build Example

on:
  push:
    branches:
      - main

jobs:
  checkout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
             node-version: '20.x'
        
      - name: Setup NPM framework
        run: npm install
        
      - name: Bundle code into zip
        run: zip -r build.zip .
        
      - name: Show directory contents & listing
        run: ls -alhR
